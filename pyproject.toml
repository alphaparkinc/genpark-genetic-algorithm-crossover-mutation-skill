[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-genetic-algorithm-crossover-mutation-skill"
version = "1.0.0"
description = "Genetic algorithm optimizer with tournament selection, single-point crossover, bit-flip mutation, and elitism."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-genetic-algorithm-crossover-mutation-skill"
Repository = "https://github.com/alphaparkinc/genpark-genetic-algorithm-crossover-mutation-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-genetic-algorithm-crossover-mutation-skill/issues"
